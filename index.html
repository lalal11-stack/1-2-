<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중간고사 문제풀이</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1c1a;--muted:#6b6862;--line:#e3e0d8;--accent:#2f6b4f;--accent-soft:#e3efe8;--bad:#b4442f;--bad-soft:#f8e6e1;--good:#2f6b4f;--warn:#a5701a;--red:#c8372d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#211f1d;--ink:#ecebe7;--muted:#a19d95;--line:#35322e;--accent:#7cc39c;--accent-soft:#22362b;--bad:#ef8a75;--bad-soft:#3a2420;--good:#7cc39c;--warn:#e0b25a;--red:#ff7b6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer}
.tab b{display:block;font-size:16px}.tab span{font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.good{background:var(--accent-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.big{flex:1;font-size:17px;min-height:52px}
.muted{color:var(--muted);font-size:14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--bg);border-radius:10px;padding:8px 10px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.secs{display:grid;gap:6px;margin:10px 0}
.secs label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.secs label small{margin-left:auto;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--accent)}
.q{font-size:19px;font-weight:600;line-height:1.55;margin:6px 0 14px;white-space:pre-wrap}
.ans{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.ans .a{font-size:18px;white-space:pre-wrap}
.ans table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0;display:block;overflow-x:auto}
.ans th,.ans td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.ans ul{padding-left:20px;margin:6px 0}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.red{color:var(--red);border-color:var(--red)}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.timer.slow{color:var(--warn)}
table.rep{border-collapse:collapse;width:100%;font-size:14px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.rep td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-weight:700}.pill.lo{color:var(--bad)}.pill.mid{color:var(--warn)}.pill.hi{color:var(--good)}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
h2{font-size:17px;margin:4px 0 8px}h3{font-size:15px;margin:14px 0 6px}
.hidden{display:none!important}
.inp{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea.inp{min-height:150px;resize:vertical}
.verdict{border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700}
.verdict.ok{background:var(--accent-soft);color:var(--good)}.verdict.part{background:#f6ecd6;color:var(--warn)}.verdict.ng{background:var(--bad-soft);color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .verdict.part{background:#3a301c}}
.kw{display:inline-block;margin:3px 4px 0 0;padding:2px 8px;border-radius:999px;font-size:13px;font-weight:600}
.kw.hit{background:var(--accent-soft);color:var(--good)}.kw.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline}
.opts{display:grid;gap:8px;margin:4px 0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;line-height:1.45;cursor:pointer;min-height:48px}
.opt .on{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt.multi .on{border-radius:6px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.opt.sel .on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.opt.right{border-color:var(--good);background:var(--accent-soft)}.opt.right .on{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .on{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt:disabled{cursor:default;opacity:1}
.opt:focus,.btn:focus{outline:3px solid var(--accent);outline-offset:2px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.iconbtn.star{font-size:36px;line-height:1;color:#f2b705}
.iconbtn.star.on{text-shadow:0 0 1px #c99200}
.iconbtn.minus span{display:block;width:36px;height:36px;border-radius:50%;background:#e03b2f;position:relative}
.iconbtn.minus span:after{content:"";position:absolute;left:9px;right:9px;top:50%;height:5px;margin-top:-2.5px;border-radius:3px;background:#fff}
.iconbtn:focus{outline:3px solid var(--accent);outline-offset:2px}
.fixbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.fixin{max-width:728px;margin:0 auto}
.fixin .big{min-height:46px}
body.hasfix .wrap{padding-bottom:150px}
.kbhint{font-size:12px;color:var(--muted);margin-top:6px}
.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.oxrow .opt{justify-content:center;font-size:22px;font-weight:700;min-height:64px}.oxrow .opt .on{display:none}
.ex{margin-top:6px;font-size:14px;color:var(--muted);white-space:pre-wrap}
.mine{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px;margin-top:6px}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;margin-top:8px}
@media print{.tabs,.noprint,header .btn{display:none!important}body{background:#fff;color:#000}.card{border:none;padding:0}}
</style>
</head>

요 기능", "a": "D: 혈중 칼슘 농도 조절(피부에서 합성) / E: 항산화 / K: 혈액 응고", "id": "food-a1f73797"}, {"sec": "비타민·무기질·물", "q": "결핍증 연결: B1 / B2 / B3 / 엽산 / C", "a": "각기병 / 구순구각염 / 펠라그라 / 거대적아구성 빈혈 / 괴혈병", "id": "food-c46edab0"}, {"sec": "비타민·무기질·물", "q": "펠라그라의 원인 비타민, 트립토판 전환 비율, 4D", "a": "나이아신(B3) / 트립토판 60mg → 나이아신 1mg / 피부염, 설사, 정신질환, 죽음", "id": "food-8597e6b8"}, {"sec": "비타민·무기질·물", "q": "비타민 C의 기능 4가지", "a": "콜라겐 합성, 항산화, 비타민 E 절약, 철 흡수 도움", "id": "food-78ae9faa"}, {"sec": "비타민·무기질·물", "q": "칼슘 흡수 촉진 vs 방해 물질 / 칼슘 결핍증", "a": "촉진: 비타민 D, 젖당, 비타민 C, 단백질 / 방해: 옥살산, 피트산, 식이섬유 / 골연화증, 구루병", "id": "food-bf6b7cb2"}, {"sec": "비타민·무기질·물", "q": "무기질 연결: 엽록소 / 티록신 / 비타민 B12 / 헤모글로빈", "a": "마그네슘 / 요오드 / 코발트 / 철", "id": "food-0e30aa9e"}, {"sec": "비타민·무기질·물", "q": "골다공증·충치 발생을 억제하는 무기질", "a": "불소 (95%가 뼈·치아)", "id": "food-9e1a45eb"}, {"sec": "비타민·무기질·물", "q": "알칼리성 식품 vs 산성 식품 (원소와 예)", "a": "알칼리성: Ca·Mg·Na·K 등 많음, 과실·채소·해조류 / 산성: S·Cl·P 등 많음, 육류·어류", "id": "food-951192f3"}, {"sec": "비타민·무기질·물", "q": "자유수 vs 결합수", "a": "자유수: 용매 작용, 증발·동결 O / 결합수: 성분과 강하게 결합, 증발·동결 X", "id": "food-bf5bc87b"}, {"sec": "비타민·무기질·물", "q": "수분활성도(Aw)의 정의", "a": "식품의 증기압(P) / 순수한 물의 증기압(P0), 식품은 Aw < 1", "id": "food-b001620c"}], "essays": [{"id": "food-Q1", "q": "식품위생법상 식품의 정의를 쓰고, 식품의 1차·2차·3차 기능을 각각 설명하시오. (5점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>식품: 의약으로 섭취하는 것을 제외한 모든 음식물 (식품위생법 제2조).<\/li>\n<li>1차 기능: 인간이 살아가는 데 필요한 영양소를 제공하는 기능.<\/li>\n<li>2차 기능(기호성): 섭취를 통해 포만감과 기호성을 충족시켜 먹는 즐거움을 주는 기능.<\/li>\n<li>3차 기능: 질병을 예방하고 건강을 유지하도록 기능성 성분과 생리활성물질을 제공하는 기능.<\/li>\n<li>핵심 키워드: 의약 제외 / 영양소 제공 / 포만감·기호성 / 질병 예방·기능성 성분·생리활성물질<\/li>\n<li>출처: (1장 p1~p2)<\/li>\n<\/ul>"}, {"id": "food-Q2", "q": "아미노산을 곁사슬의 성질에 따라 분류하고, 각 분류에 속하는 아미노산을 모두 쓰시오. (10점)", "extra": "", "extraHtml": "", "a": "<p>20개 아미노산은 곁사슬 구조만 다르므로 곁사슬의 성질에 따라 산성, 염기성, 중성으로 나누고, 중성은 다시 지방족·방향족·함황·극성으로 나눈다.\n- 지방족(탄소·수소만, 소수성): 글리신, 알라닌, 프롤린, 발린, 루신, 아이소루신\n- 방향족(방향족 고리, 소수성): 페닐알라닌, 티로신, 트립토판\n- 함황(황 원자 포함): 메티오닌, 시스테인\n- 극성(전하 없음, N·O에 결합한 H로 수소결합 가능): 세린, 트레오닌, 아스파라긴, 글루타민\n- 산성(곁사슬에 카복실기, 중성 pH에서 -COO⁻): 아스파트산, 글루탐산\n- 염기성(곁사슬에 아미노기, 중성 pH에서 -NH3⁺): 라이신, 아르지닌, 히스티딘\n- 핵심 키워드: 곁사슬 / 산성·염기성·중성(지방족·방향족·함황·극성) / 6-3-2-4-2-3개\n- 출처: (단백질 p3, p5, p7)<\/p>"}, {"id": "food-Q3", "q": "필수아미노산의 정의와 종류를 쓰고, 제1제한 아미노산의 개념을 정백미를 예로 들어 설명하시오. (6점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>필수아미노산: 인체에서 생합성되지 않으므로 식품으로부터 반드시 섭취해야 하는 아미노산.<\/li>\n<li>종류(8가지): 발린, 루신, 아이소루신, 트레오닌, 라이신, 메티오닌, 페닐알라닌, 트립토판.<\/li>\n<li>제1제한 아미노산: 식품에 들어 있는 필수아미노산 중 인체 요구량에 비해 가장 적게 들어 있는 것(두 번째로 부족한 것은 제2제한 아미노산).<\/li>\n<li>예: 정백미의 제1제한 아미노산은 라이신(리신)이다.<\/li>\n<li>핵심 키워드: 생합성 불가 / 반드시 섭취 / 8종 / 요구량 대비 가장 부족 / 정백미 = 라이신<\/li>\n<li>출처: (단백질 p7~p8)<\/li>\n<\/ul>"}, {"id": "food-Q4", "q": "아미노산의 양성 전해질 성질과 등전점(pI)을 설명하고, 글리신(pK1 = 2.35, pK2 = 9.6)의 등전점을 계산하시오. (6점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>아미노산은 한 분자 내에 양전하와 음전하를 동시에 가지는 양성 전해질이다.<\/li>\n<li>양전하와 음전하의 합을 실제전하(net charge)라 하며, 두 값이 같아 실제전하가 0이 되는 pH를 등전점(pI)이라 한다. 전하를 띠는 기가 없다는 뜻이 아니라 개수가 같다는 뜻이다.<\/li>\n<li>pH가 pI보다 낮으면 양전하(+1), pI에서 0(쌍극성 이온), pI보다 높으면 음전하(-1)를 띤다.<\/li>\n<li>계산: pI = (pK1 + pK2) / 2 = (2.35 + 9.6) / 2 ≈ 5.97<\/li>\n<li>핵심 키워드: 양성 전해질 / 실제전하 0인 pH / pI = (pK1 + pK2) / 2 / 글리신 ≈ 5.97<\/li>\n<li>출처: (단백질 p8~p10)<\/li>\n<\/ul>"}, {"id": "food-Q5", "q": "단백질의 등전점을 이용하여 발효유제품을 만드는 원리를 설명하시오. (4점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>단백질의 염기성·산성 아미노산 곁사슬은 용액 pH에 따라 전하를 가지며, 전하가 중성이 되는 등전점을 가진다.<\/li>\n<li>등전점에서는 단백질 사이에 전기적 반발력이 없어 용해도가 최소가 되고 응집·침전된다.<\/li>\n<li>우유 단백질인 카제인의 등전점은 pI 4.6이다. 발효로 pH가 4.6 이하로 내려가면 카제인이 응고되어 발효유제품이 만들어진다.<\/li>\n<li>핵심 키워드: 등전점에서 용해도 최소 / 전기적 반발력 없음 → 응집 / 카제인 pI 4.6 / 응고<\/li>\n<li>출처: (단백질 p15)<\/li>\n<\/ul>"}, {"id": "food-Q6", "q": "단백질 용해도에 영향을 주는 염농도의 효과로서 염용과 염석을 비교하여 설명하시오. (5점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>염용(salting-in): 단백질이 묽은 염류 용액에서 용해도가 증가하는 현상.<\/li>\n<li>염석(salting-out): 고농도의 염이 물과 상호작용하여 물과 단백질의 상호작용을 방해하므로, 단백질끼리 응집하여 침전하는 현상.<\/li>\n<li>수용성 단백질은 고농도의 염류에서, 소수성 단백질은 저농도의 염류에서 염석이 일어난다.<\/li>\n<li>즉 염농도가 낮을 때는 용해도가 증가하다가(염용) 염농도가 높아지면 용해도가 감소한다(염석).<\/li>\n<li>핵심 키워드: 묽은 염 → 용해도 증가 / 고농도 염 → 물-단백질 상호작용 방해 → 응집·침전<\/li>\n<li>출처: (단백질 p15)<\/li>\n<\/ul>"}, {"id": "food-Q7", "q": "단백질의 1차·2차·3차·4차 구조를 각각 설명하고, 구조를 유지하는 결합을 쓰시오. (8점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>1차 구조: N-말단에서 C-말단 방향으로 연결된 아미노산의 순서, 펩타이드 결합으로 연결.<\/li>\n<li>2차 구조: 사슬 내에서 반복되는 특별한 모양으로 α-나선(오른쪽 회전 나선)과 β-병풍(지그재그)이 있으며 수소결합으로 유지된다.<\/li>\n<li>3차 구조: 2차 구조를 유지하면서 접힌 입체 구조로, 소수성 부위는 안쪽·친수성 부위는 바깥에 위치한다. 이온결합, 이황화결합(-S-S-), 수소결합, 소수성 결합이 안정화한다.<\/li>\n<li>4차 구조: 3차 구조를 가진 여러 폴리펩타이드 사슬이 모인 복합체(예: 헤모글로빈).<\/li>\n<li>핵심 키워드: 아미노산 순서·펩타이드 결합 / α-나선·β-병풍·수소결합 / 접힌 구조·이온·이황화·수소·소수성 결합 / 여러 사슬 복합체<\/li>\n<li>출처: (단백질 p11~p14)<\/li>\n<\/ul>"}, {"id": "food-Q8", "q": "단백질 변성의 정의를 쓰고, 변성을 일으키는 요인 5가지를 각각의 원리와 함께 설명하시오. (8점)", "extra": "", "extraHtml": "", "a": "<p>변성이란 외부 요인에 의해 단백질 고유의 3차 구조가 바뀌는 것이다.\n- 가열: 수소결합이 약해져 숨어 있던 소수성 부위가 노출되고, 소수성 결합으로 뭉쳐 응고된다.\n- pH: 강산·강염기에서 곁사슬의 전하가 바뀌어 이온결합이 약해진다.\n- 동결: 얼음 결정이 커지는 재결정현상으로 구조가 파괴되어 해동 후 수용성을 잃는다(염류 농축·pH 변화 동반).\n- 알코올(유기용매): 단백질과 물의 상호작용을 약화시켜 침전시킨다.\n- 교반: 전단응력(shear stress)에 의해 변성된다.\n- 핵심 키워드: 3차 구조 변화 / 가열·pH·동결·알코올·교반 / 소수성 노출·이온결합 약화·재결정현상·전단응력\n- 출처: (단백질 p16~p17)<\/p>"}, {"id": "food-Q9", "q": "환원당의 정의를 쓰고, (1) 케톤기를 가진 과당이 환원당인 이유와 (2) 슈크로스(자당)가 비환원당인 이유를 맥아당·젖당과 비교하여 설명하시오. (8점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>환원당: 산화될 수 있는 물질, 즉 환원력을 가진 당. 헤미아세탈 구조를 가진 환형 당은 알데하이드기를 가진 사슬 구조로 가역적으로 풀릴 수 있어 -CHO가 -COOH로 산화되므로 환원력을 가진다.<\/li>\n<li>(1) 과당: 케톤기 자체는 산화되지 않지만 케토스가 알도스로 이성화된 뒤 산화될 수 있으므로 케토스도 환원당이다.<\/li>\n<li>(2) 자당: 글리코시드 결합에 관여한 아노머 중심은 아세탈 구조가 되어 사슬로 열리지 못한다. 자당은 포도당과 과당의 아노머 중심들끼리 결합하므로 헤미아세탈 구조가 남지 않아 비환원당이다.<\/li>\n<li>비교: 맥아당(포도당+포도당, α-글리코시드 결합)과 젖당(갈락토스+포도당, β-글리코시드 결합)은 한쪽 포도당 잔기에 헤미아세탈 구조가 남아 있어 환원당이다.<\/li>\n<li>핵심 키워드: 헤미아세탈 → 사슬로 풀림 → 환원력 / 케토스 → 알도스 이성화 / 아노머 중심끼리 결합 → 아세탈 → 비환원당<\/li>\n<li>출처: (탄수화물 p9~p12)<\/li>\n<\/ul>"}, {"id": "food-Q10", "q": "아밀로스와 아밀로펙틴을 결합 형태, 구조, 전분 내 비율, 요오드 반응, 노화 경향 측면에서 비교하시오. (6점)", "extra": "", "extraHtml": "", "a": "<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>아밀로스<\/th>\n<th>아밀로펙틴<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>결합<\/td>\n<td>α-1,4<\/td>\n<td>α-1,4 + α-1,6<\/td>\n<\/tr>\n<tr>\n<td>구조<\/td>\n<td>직쇄<\/td>\n<td>포도당 15~30개 간격으로 가지<\/td>\n<\/tr>\n<tr>\n<td>전분 내 비율<\/td>\n<td>20~30%<\/td>\n<td>70~80%<\/td>\n<\/tr>\n<tr>\n<td>요오드 반응<\/td>\n<td>청색(포접화합물)<\/td>\n<td>자주색<\/td>\n<\/tr>\n<tr>\n<td>노화·젤화<\/td>\n<td>많을수록 잘 일어남<\/td>\n<td>많을수록 덜 일어남<\/td>\n<\/tr>\n<tr>\n<td>- 핵심 키워드: 직쇄 α-1,4 vs 가지 α-1,6 / 20~30% vs 70~80% / 청색 vs 자주색 / 아밀로스 많으면 노화 쉬움<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>- 출처: (탄수화물 p13~p16)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "food-Q11", "q": "전분 호화의 정의를 쓰고, 호화 4단계를 점도 변화와 함께 설명하시오. (8점)", "extra": "", "extraHtml": "", "a": "<p>호화란 물의 공급과 가열로 결정형 구조를 이루는 아밀로펙틴 사슬 간 수소결합이 약해져 생전분이 결정성을 상실하는 과정이며(호화전분 = α-전분), 소화효소에 의한 가수분해가 쉬워진다.\n- ① 수화: 비결정성 부분에서 수화가 일어나고 아밀로스가 유출되어 점도가 상승한다.\n- ② 팽윤: 호화온도(55~70℃)에서 최대 팽윤 온도(90℃ 부근)까지 팽윤하며 결정성을 잃고 점도가 증가한다(아밀로펙틴은 아직 남아 있음).\n- ③ 붕괴: 전분 입자가 파괴되고 아밀로펙틴이 빠져나와 반투명 교질용액이 되며 점도가 급격히 감소한다.\n- ④ 젤화: 냉각하면 3차원 망상구조를 형성해 물을 가두며, 아밀로스가 많을수록 잘 일어난다.\n- 핵심 키워드: 수소결합 약화·결정성 상실 / 수화(점도↑) → 팽윤(55~70℃) → 붕괴(점도 급감) → 젤화(망상구조)\n- 출처: (탄수화물 p14)<\/p>"}, {"id": "food-Q12", "q": "전분 노화의 정의를 쓰고, 노화가 잘 일어나는 조건과 거의 일어나지 않는 조건을 쓰시오. (5점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>노화: 호화된 전분에서 수소결합이 다시 형성되어 생전분과 다른 형태가 되는 것으로, 소화율이 떨어진다.<\/li>\n<li>잘 일어나는 조건: 전분 입자가 작을수록, 아밀로스 함량이 많을수록, 산성 pH, 수분 30~60%, 온도 0~5℃.<\/li>\n<li>거의 일어나지 않는 조건: 알칼리 pH, 60℃ 이상, -20℃ 이하.<\/li>\n<li>핵심 키워드: 수소결합 재형성 / 아밀로스↑·산성·수분 30~60%·0~5℃ / 알칼리·60℃ 이상·-20℃ 이하<\/li>\n<li>출처: (탄수화물 p16)<\/li>\n<\/ul>"}, {"id": "food-Q13", "q": "전분 가수분해효소 α-amylase, β-amylase, 글루코아밀레이스의 작용 방식을 비교하시오. (4점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>α-amylase: 사슬 중간의 α-1,4 결합을 절단하며 α-1,6 결합 근처는 자르지 못해 α-제한덱스트린이 남는다. 액화효소.<\/li>\n<li>β-amylase: 비환원성 말단부터 맥아당 단위로 자른다. 당화효소.<\/li>\n<li>글루코아밀레이스: 비환원성 말단부터 포도당 단위로 자른다. 당화효소.<\/li>\n<li>핵심 키워드: α = 중간 절단·액화 / β = 말단부터 맥아당·당화 / 글루코아밀레이스 = 말단부터 포도당·당화<\/li>\n<li>출처: (탄수화물 p17)<\/li>\n<\/ul>"}, {"id": "food-Q14", "q": "지질을 구조에 따라 3가지로 분류하고 각각의 정의와 예를 쓰시오. (5점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>단순지질: 지방산과 알코올의 에스터 결합. 예: 유지(글리세롤 1 + 지방산 3 = 트리글리세라이드, 중성지방).<\/li>\n<li>복합지질: 지방산 + 알코올에 인·황·당·질소화합물 등이 결합. 예: 인지질인 레시틴(글리세롤 + 지방산 2 + 인산·콜린).<\/li>\n<li>유도지질: 단순지질·복합지질의 가수분해로 얻어지는 물질. 예: 고급지방산, 고급알코올, 스테롤, 스핑고신, 탄화수소.<\/li>\n<li>핵심 키워드: 에스터 결합·트리글리세라이드 / 인·황·당·질소·레시틴 / 가수분해 산물·스테롤<\/li>\n<li>출처: (지질 p1~p2)<\/li>\n<\/ul>"}, {"id": "food-Q15", "q": "포화지방산과 불포화지방산의 특징을 비교하고, 오메가-3·오메가-6 지방산의 예를 쓰시오. (5점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>포화지방산: 이중결합이 없고 상온에서 고체, 탄소 수가 많을수록 녹는점이 높다. 예: 팔미트산(C16), 스테아르산(C18).<\/li>\n<li>불포화지방산: 이중결합이 1~6개, 상온에서 액체, 산소에 쉽게 산화되며 이중결합이 많을수록 산패되기 쉽다. 예: 올레산(1개), 리놀레산(2개), 리놀렌산(3개).<\/li>\n<li>오메가-3: 리놀렌산(들기름·대두유), EPA·DHA(등푸른생선).<\/li>\n<li>오메가-6: 리놀레산, 아라키돈산(참기름·면실유·땅콩유·해바라기유).<\/li>\n<li>핵심 키워드: 이중결합 유무 / 고체 vs 액체 / 산화·산패 / 리놀렌산·EPA·DHA vs 리놀레산·아라키돈산<\/li>\n<li>출처: (지질 p2~p4)<\/li>\n<\/ul>"}, {"id": "food-Q16", "q": "유화의 원리를 설명하고, 유중수적형(W/O)과 수중유적형(O/W)을 식품 예와 함께 비교하시오. (5점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>유화: 레시틴처럼 한 분자 내에 친수기와 소수기를 모두 가진 물질(유화제)이 있으면 섞이지 않는 물과 기름이 분산된 상태가 된다.<\/li>\n<li>유중수적형(W/O, water in oil): 기름이 분산매, 물방울이 분산상. 예: 버터, 마가린.<\/li>\n<li>수중유적형(O/W, oil in water): 물이 분산매, 지방구가 분산상. 예: 우유, 마요네즈.<\/li>\n<li>핵심 키워드: 친수기 + 소수기(레시틴) / 기름 속 물방울 = 버터·마가린 / 물 속 지방구 = 우유·마요네즈<\/li>\n<li>출처: (지질 p5)<\/li>\n<\/ul>"}, {"id": "food-Q17", "q": "유지의 경화를 설명하고, 경화 과정에서 생기는 트랜스지방의 문제점을 쓰시오. (5점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>경화: 액체 유지에 니켈 촉매를 사용해 수소를 첨가하여 불포화지방산을 포화지방산으로 바꾸고, 액체를 고체로 만드는 것. 예: 마가린, 쇼트닝.<\/li>\n<li>트랜스지방: 경화 과정에서 cis형 이중결합이 trans형으로 바뀐 트랜스 지방산이 생긴다. 트랜스 지방산은 일직선 구조를 가져 포화지방처럼 작용하므로 심혈관 질환 위험을 높인다.<\/li>\n<li>핵심 키워드: 니켈 촉매·수소 첨가 / 불포화 → 포화, 액체 → 고체 / 마가린·쇼트닝 / cis → trans, 일직선, 심혈관 질환<\/li>\n<li>출처: (지질 p6)<\/li>\n<\/ul>"}, {"id": "food-Q18", "q": "유지 산패의 정의를 쓰고, 원인에 따른 산패의 종류 3가지를 설명하시오. (8점)", "extra": "", "extraHtml": "", "a": "<p>산패란 유지나 지질식품이 저장·가공·조리 중 불쾌한 냄새·맛, 착색, 점성 증가 등으로 품질과 영양가가 떨어지는 현상이다.\n- 가수분해적 산패: 물과 접촉한 유지가 약산·알칼리·열(화학적) 또는 lipase(효소)에 의해 글리세롤과 지방산으로 분해된다. 수분과 저급지방산이 많은 낙농제품에서 특히 문제가 된다.\n- 산화적 산패: 불포화지방산의 이중결합에 산소가 결합해 과산화물이 생기고, 자동산화(개시·전파·종결)가 진행되어 휘발성 불쾌취가 생긴다.\n- 가열 산패: 튀김처럼 고온에서 계속 가열할 때 분해산물이 중합하여 점도 증가, 색이 짙어짐, 거품, 발연점 저하가 일어난다.\n- 핵심 키워드: 가수분해적(물·lipase·낙농제품) / 산화적(산소·과산화물·자동산화) / 가열(고온·중합·점도↑·발연점↓)\n- 출처: (지질 p7~p8)<\/p>"}, {"id": "food-Q19", "q": "유지의 자동산화 3단계를 설명하고, 이를 억제하는 항산화제를 천연·합성으로 나누어 쓰시오. (6점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>개시: 지방산(RH)으로부터 유리 라디칼(R·)이 생성된다(RH → R·).<\/li>\n<li>전파: R·이 산소와 결합해 ROO·이 되고, ROO·이 다른 지방산(RH)에서 수소를 빼앗아 과산화물(ROOH)과 새로운 R·을 만드는 반응이 반복된다.<\/li>\n<li>종결: 라디칼끼리 결합하여 반응이 끝나며, 풍미 변질과 독성 물질이 생긴다.<\/li>\n<li>항산화제: 산화를 지연시키는 자유기 제거제(free radical scavenger). 천연은 비타민 C(아스코르브산), 비타민 E(토코페롤), 티올류 / 합성은 BHT, BHA, PG.<\/li>\n<li>핵심 키워드: 개시(R·) → 전파(ROO·, ROOH 반복) → 종결(라디칼끼리 결합) / 자유기 제거제 / 비타민 C·E vs BHT·BHA·PG<\/li>\n<li>출처: (지질 p8, p10)<\/li>\n<\/ul>"}, {"id": "food-Q20", "q": "펠라그라를 설명하고, 비타민 B1·B2·엽산·C의 결핍증을 각각 쓰시오. (6점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>펠라그라: 수용성 비타민 나이아신(B3)의 결핍증으로 피부 염증, 소화관 염증, 신경계 장애가 나타난다. 나이아신 결핍 또는 트립토판이 풍부한 단백질의 섭취 부족이 원인이며, 트립토판 60mg이 나이아신 1mg으로 전환되므로 트립토판이 많은 육류가 좋은 급원이다. 증상은 피부염·설사·정신질환·죽음의 4D이다.<\/li>\n<li>B1(티아민): 각기병, 신경염<\/li>\n<li>B2(리보플래빈): 구순구각염, 설염, 피부염<\/li>\n<li>엽산(B9): 거대적아구성 빈혈, 임신 초기 부족 시 태아 신경관 결손<\/li>\n<li>C(아스코르브산): 괴혈병, 빈혈, 잇몸 출혈<\/li>\n<li>핵심 키워드: 나이아신 결핍 / 트립토판 60mg → 나이아신 1mg / 4D / 각기병·구순구각염·거대적아구성 빈혈·괴혈병<\/li>\n<li>출처: (비타민 p6~p11)<\/li>\n<\/ul>"}, {"id": "food-Q21", "q": "골다공증 및 충치 발생을 억제하는 무기질을 쓰고, 칼슘의 흡수를 촉진하는 요인과 방해하는 요인을 쓰시오. (4점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>불소: 미량 무기질로 체내 약 95%가 뼈와 치아에 존재하며 골다공증 및 충치 발생을 억제한다.<\/li>\n<li>칼슘 흡수 촉진: 비타민 D, 젖당, 비타민 C, 단백질.<\/li>\n<li>칼슘 흡수 방해: 옥살산, 피트산, 식이섬유.<\/li>\n<li>참고: 칼슘이 부족하면 골연화증, 구루병이 생긴다.<\/li>\n<li>핵심 키워드: 불소 / 95% 뼈·치아 / 촉진 = 비타민 D·젖당·비타민 C / 방해 = 옥살산·피트산<\/li>\n<li>출처: (무기질 p12, p17)<\/li>\n<\/ul>"}, {"id": "food-Q22", "q": "수분활성도(Aw)의 정의를 쓰고, 자유수와 결합수를 비교하시오. (5점)", "extra": "", "extraHtml": "", "a": "<ul>\n<li>식품의 저장성은 수분 함량이 아니라 변화에 관여할 수 있는 수분의 비율이 중요하다.<\/li>\n<li>수분활성도(Aw) = 같은 조건에서 식품의 증기압(P) / 순수한 물의 증기압(P0). 순수한 물은 1이고, 식품은 수분이 성분과 결합해 증발이 덜 되므로 1보다 작다. Aw는 화학반응과 미생물 생육에 영향을 준다.<\/li>\n<li>자유수: 용매로 작용하며 증발·동결이 일어난다.<\/li>\n<li>결합수: 식품 성분과 강하게 결합하여 증발·동결이 일어나지 않는다.<\/li>\n<li>핵심 키워드: P / P0 / 순수한 물 = 1, 식품 &lt; 1 / 자유수(용매·증발·동결 O) vs 결합수(강한 결합·증발·동결 X)<\/li>\n<li>출처: (물 p20~p21)<\/li>\n<\/ul>"}]}};
const KEY='gaeun-1-2-quiz-v1';

let S={items:{},sessions:[],cur:null,hidden:{},star:{}};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.items)S=Object.assign(S,v)}catch(e){}

    if(it.t==='oxfix'&&picked[0]===1){const typed=($('#fixin')||{}).value||'';const alts=String(it.fix||'').split('|').filter(Boolean);const fixOk=!!typed.trim()&&alts.some(x=>norm(typed).includes(norm(x)));lastGrade.text='X → '+(typed||'(안 씀)');if(it.a==='X'&&!fixOk){lastGrade.v='ng';lastGrade.fixmiss=true}if(it.a==='X'&&fixOk)lastGrade.v='ok';const fb=$('#fixin');if(fb)fb.disabled=true}
    if(it.t==='oxfix'&&it.a==='X'&&it.wrong){const qe=document.querySelector('.q');if(qe)qe.innerHTML=esc(it.q).replace(esc(it.wrong),'<span style="color:var(--bad);text-decoration:underline;text-decoration-thickness:2px">'+esc(it.wrong)+'</span>')}
    document.querySelectorAll('#opts .opt').forEach(b=>{const oi=ch.order[+b.dataset.k];b.disabled=true;if(want.includes(oi))b.classList.add('right');else if(picked.includes(oi))b.classList.add('wrong');b.classList.remove('sel')})}
  else{const v=$('#in').value;lastGrade=grade(it,S.cur.mode,v);lastGrade.text=v;$('#in').classList.add('hidden')}
  showVerdict();$('#ans').classList.remove('hidden');$('#pre').classList.add('hidden');$('#post').classList.remove('hidden');$('#nextQ').focus()}
function showVerdict(){const g=lastGrade;const lab=g.v==='ok'?'맞음 ✓':g.v==='part'?'부분 정답 — 빠진 키워드가 있어요 (틀림으로 기록)':g.order?'틀림 ✗ — 빈칸 순서가 바뀌었어요':g.fixmiss?'X는 맞았는데 고친 단어가 달라요 (틀림으로 기록)':'틀림 ✗';
  $('#vd').innerHTML=`<div class="verdict ${g.v}">${g.empty?'모르겠음 → 틀림':lab}${g.flipped?' <span style="font-weight:400">(직접 바꿈)</span>':''}</div>${g.text?`<div class="muted">내 답</div><div class="mine">${esc(g.text)}</div>`:''}${(g.hit.length||g.miss.length)?`<div style="margin-top:8px">${g.hit.map(k=>`<span class="kw hit">${esc(k)}</span>`).join('')}${g.miss.map(k=>`<span class="kw miss">${esc(k)}</span>`).join('')}</div>`:''}`;
  const f=$('#flip');if(f)f.textContent=g.v==='ok'?'사실 틀렸어요':'사실 맞았어요'}
function mark(r){
  const c=S.cur;const id=c.queue[c.i];const sec=revealed?ansSec:Math.floor((Date.now()-t0)/1000);clearInterval(tick);
  const s=st(id);s.n++;s[r]++;s.last=r;s.time+=sec;s.at=today();
  c.res[id]={r,sec};c.i++;save();card();
}
let curChoice=null;
function navList(){const vis=b=>b&&!b.disabled&&b.offsetParent!==null;if(!revealed)return [...document.querySelectorAll('#opts .opt'),$('#show'),$('#dk'),$('#hideQ')].filter(vis);return [$('#nextQ'),$('#flip'),$('#back'),$('#stop'),$('#starQ'),$('#hideQ')].filter(vis)}
document.addEventListener('keydown',e=>{if(!S.cur||!$('#nextQ'))return;const k=e.key;
  if(k==='Delete'&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&$('#hideQ')){e.preventDefault();hideCur();return}
  if((k==='s'||k==='S'||k==='ㄴ')&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&$('#starQ')){e.preventDefault();starCur();return}
  if(k==='Escape'){if(revealed)return;e.preventDefault();const ae=document.activeElement;
    if(ae&&ae.id==='fixin'){$('#fixbox').classList.add('hidden');ae.value='';if(curChoice){curChoice.sel.clear();document.querySelectorAll('#opts .opt').forEach(b=>b.classList.remove('sel'))}const xb=document.querySelector('#opts .opt[data-k="1"]');if(xb)xb.focus();return}
    $('#dk').click();return}
  if(!/^Arrow(Up|Down|Left|Right)$/.test(k))return;if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const L=navList();if(!L.length)return;e.preventDefault();const d=(k==='ArrowUp'||k==='ArrowLeft')?-1:1;const i=L.indexOf(document.activeElement);
  (i<0?L[d>0?0:L.length-1]:L[(i+d+L.length)%L.length]).focus()});
function pick(k){const ch=curChoice;if(!ch||revealed)return;if(k<0||k>=ch.order.length)return;
  if(ch.it.t==='oxfix'){ch.sel=new Set([k]);document.querySelectorAll('#opts .opt').forEach(b=>b.classList.toggle('sel',+b.dataset.k===k));if(k===1){const fb=$('#fixbox');fb.classList.remove('hidden');const fi=$('#fixin');setTimeout(()=>fi.focus(),30);fi.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();ev.stopPropagation();reveal(ch.it)}}}else reveal(ch.it);return}
  if(ch.multi){ch.sel.has(k)?ch.sel.delete(k):ch.sel.add(k);document.querySelectorAll('#opts .opt').forEach(b=>b.classList.toggle('sel',ch.sel.has(+b.dataset.k)))}else{ch.sel=new Set([k]);reveal(ch.it)}}
document.addEventListener('keydown',e=>{if(S.cur&&!revealed&&curChoice&&!/INPUT|TEXTAREA/.test(e.target.tagName)){if(/^[1-9]$/.test(e.key)){e.preventDefault();pick(+e.key-1)}else if((curChoice.it.t==='ox'||curChoice.it.t==='oxfix')&&/^[oOxX]$/.test(e.key)){e.preventDefault();pick(/[oO]/.test(e.key)?0:1)}else if(e.key==='Enter'&&((e.ctrlKey||e.metaKey)||(e.target.tagName!=='BUTTON'&&curChoice.sel.size))){e.preventDefault();e.stopImmediatePropagation();reveal(curChoice.it)}return}});
document.addEventListener('keydown',e=>{if(!S.cur||!revealed||/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName))return;if(e.key==='Enter'){e.preventDefault();mark(lastGrade.v==='ok'?'ok':'ng')}});

function finishRound(dropOnly){
  const c=S.cur;const done=Object.keys(c.res);
  if(done.length){const ok=done.filter(k=>c.res[k].r==='ok').length;S.sessions.push({subj:c.subj,mode:c.mode,round:c.round,label:c.label,date:today(),total:done.length,ok,wrong:done.filter(k=>c.res[k].r==='ng'),slow:done.filter(k=>c.res[k].r==='ok'&&c.mode==='test'&&c.res[k].sec>=SLOW_SEC)})}
  if(dropOnly){S.cur=null;save();home()}
}
function endRound(){
  clearInterval(tick);const c=S.cur;finishRound(false);
  const last=S.sessions[S.sessions.length-1];
  const next=[...last.wrong,...last.slow];
  const pct=Math.round(last.ok/last.total*100);
  $('#view').innerHTML=`<section class="card"><h2>${c.round}차 끝</h2>
   <div class="stat"><div><b>${last.ok}/${last.total}</b><span>맞음</span></div><div><b>${pct}%</b><span>정답률</span></div><div><b>${next.length}</b><span>다음 회차 대상</span></div></div>
   <p class="muted">다음 회차 = 틀린 ${last.wrong.length}문항${c.mode==='test'?` + 맞았지만 ${SLOW_SEC}초 넘게 걸린 ${last.slow.length}문항`:''}</p>
   <div class="row">${next.length&&c.round<3?`<button class="btn primary big" id="nx" type="button">${c.round+1}차 시작 (${next.length}문항)</button>`:''}${next.length&&c.round>=3?`<button class="btn primary big" id="nx" type="button">한 번 더 (${next.length}문항)</button>`:''}<button class="btn big" id="rp" type="button">결과 보고서</button></div>
   ${!next.length?'<p>전부 맞았어요. 이 범위는 끝! 👏</p>':''}</section>`;
  S.cur=null;save();
  setTimeout(()=>{const f=$('#nx')||$('#rp');if(f)f.focus()},50);
  const nx=$('#nx');if(nx)nx.onclick=()=>{S.cur={subj:c.subj,mode:c.mode,round:c.round+1,label:c.label,queue:c.shuf?shuffle(next.slice()):next.slice(),i:0,res:{},shuf:c.shuf,started:Date.now()};save();card()};
  $('#rp').onclick=report;
}

function starList(){quizMode(false);const t=T().filter(x=>(S.star||{})[x.id]);const secs=[...new Set(t.map(x=>x.sec))];
  $('#view').innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><h2>★ 시험 전 확인 ${t.length}문항</h2><button class="btn noprint" id="bk" type="button">돌아가기</button></div>
  <p class="muted">문제 → 답 → 근거 순서로 빠르게 훑어보는 화면이에요. 답을 가리고 보려면 "답 가리기"를 켜고, 문제를 누르면 그 답만 보여요.</p>
  <label class="toggle noprint"><input type="checkbox" id="cover"> 답 가리기</label>
  ${secs.map(s=>`<h3>${esc(s)}</h3>`+t.filter(x=>x.sec===s).map(x=>`<div class="sl" style="border-bottom:1px solid var(--line);padding:8px 0"><div style="font-weight:600;cursor:pointer" class="slq">${esc(x.q)}${x.opts?`<div class="muted" style="font-weight:400">${x.opts.map((o,i)=>(i+1)+') '+esc(o)).join('  ')}</div>`:''}</div><div class="sla"><div class="a" style="color:var(--good);font-weight:700">${esc(x.disp||x.a)}</div>${x.ex?`<div class="ex">${esc(x.ex)}</div>`:''}</div><button class="btn ghost unstar noprint" data-id="${x.id}" type="button" style="min-height:30px;padding:2px 8px;font-size:12px;margin-top:4px">★ 해제</button></div>`).join('')).join('')}
  </section>`;
  $('#bk').onclick=home;
  $('#cover').onchange=e=>document.querySelectorAll('.sla').forEach(a=>a.classList.toggle('hidden',e.target.checked));
  document.querySelectorAll('.slq').forEach(q=>q.onclick=()=>q.nextElementSibling.classList.toggle('hidden'));
  document.querySelectorAll('.unstar').forEach(b=>b.onclick=()=>{delete S.star[b.dataset.id];save();starList()});}
function report(){quizMode(false);
  const t=T(),e=DATA[subj].essays;
  const secs=[...new Set(t.map(x=>x.sec))];
  const rows=secs.map(s=>{const its=t.filter(x=>x.sec===s);let ok=0,n=0,weak=0,seen=0;its.forEach(x=>{const v=S.items[x.id];if(v&&v.n){seen++;ok+=v.ok;n+=v.n;if(v.last==='ng')weak++}});const p=n?Math.round(ok/n*100):null;return {s,total:its.length,seen,p,weak}});
  const all=[...t,...e];
  const worst=all.filter(x=>S.items[x.id]&&S.items[x.id].ng).sort((a,b)=>S.items[b.id].ng-S.items[a.id].ng||((S.items[b.id].last==='ng')-(S.items[a.id].last==='ng'))).slice(0,25);
  const ses=S.sessions.filter(s=>s.subj===subj).slice(-30).reverse();
  const cls=p=>p==null?'':p<60?'lo':p<85?'mid':'hi';
  $('#view').innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><h2>${DATA[subj].name} 결과 보고서</h2><button class="btn noprint" id="pr" type="button">PDF로 저장</button></div>
   <p class="muted">${today()} 기준 · ${DATA[subj].exam} 시험 (${dday(DATA[subj].exam)})</p>
   <h3>범위별 정답률</h3><table class="rep"><tr><th>범위</th><th class="n">푼 문항</th><th class="n">정답률</th><th class="n">지금 틀림</th></tr>
   ${rows.map(r=>`<tr><td>${esc(r.s)}</td><td class="n">${r.seen}/${r.total}</td><td class="n"><span class="pill ${cls(r.p)}">${r.p==null?'—':r.p+'%'}</span></td><td class="n">${r.weak||''}</td></tr>`).join('')}
   <tr><td>예상문제 (서술형)</td><td class="n">${e.filter(x=>S.items[x.id]&&S.items[x.id].n).length}/${e.length}</td><td class="n">${(()=>{let ok=0,n=0;e.forEach(x=>{const v=S.items[x.id];if(v){ok+=v.ok;n+=v.n}});return n?`<span class="pill ${cls(Math.round(ok/n*100))}">${Math.round(ok/n*100)}%</span>`:'—'})()}</td><td class="n">${e.filter(x=>S.items[x.id]&&S.items[x.id].last==='ng').length||''}</td></tr></table>
   <h3>자주 틀린 문제</h3>${worst.length?`<table class="rep"><tr><th>문제</th><th class="n">틀림</th><th class="n">최근</th></tr>${worst.map(x=>`<tr><td>${esc(x.q)}<div class="muted">${esc(x.a&&x.a.startsWith('<')?'':x.a||'')}</div></td><td class="n">${S.items[x.id].ng}회</td><td class="n">${S.items[x.id].last==='ng'?'✗':'✓'}</td></tr>`).join('')}</table>`:'<p class="muted">아직 틀린 문제가 없어요.</p>'}
   <h3>회차 기록</h3>${ses.length?`<table class="rep"><tr><th>날짜</th><th>종류</th><th class="n">결과</th></tr>${ses.map(s=>`<tr><td>${s.date}</td><td>${s.mode==='test'?'암기 테스트':'예상문제'} ${s.round}차${s.label?' · '+esc(s.label):''}</td><td class="n">${s.ok}/${s.total} (${Math.round(s.ok/s.total*100)}%)</td></tr>`).join('')}</table>`:'<p class="muted">아직 푼 회차가 없어요.</p>'}
   <div class="row noprint" style="margin-top:16px"><button class="btn" id="bk" type="button">돌아가기</button><button class="btn ghost" id="reset" type="button">이 과목 기록 지우기</button></div></section>`;
  $('#pr').onclick=()=>window.print();$('#bk').onclick=home;
  $('#reset').onclick=()=>{if(!confirm(DATA[subj].name+' 기록을 모두 지울까요? 되돌릴 수 없어요.'))return;all.forEach(x=>delete S.items[x.id]);S.sessions=S.sessions.filter(s=>s.subj!==subj);save();report()};
}
$('#homeBtn').onclick=()=>{if(S.cur){S.cur&&save()}home()};
tabs();home();
</script>
</body>
